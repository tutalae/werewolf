[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "werewolf"
version = "0.3.0"
description = "A pass-the-device Werewolf party game for the terminal"
readme = "README.md"
requires-python = ">=3.10"
# Optional at runtime: without rich, the game falls back to plain text
dependencies = ["rich>=13"]

[project.scripts]
werewolf = "werewolf.__main__:main"
werewolf-simulate = "werewolf.simulate:main"

[tool.setuptools]
packages = ["werewolf"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["werewolf"]
strict = true
